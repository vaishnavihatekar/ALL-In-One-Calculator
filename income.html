<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income Tax Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .calculator {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 350px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            background: #ff4b5c;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #ff1e3c;
            transform: scale(1.05);
        }
        .output {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
        }
        .home-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: linear-gradient(135deg, #2ecc71, #27ae60);
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    font-weight: bold;
    text-decoration: none;
}

.home-btn:hover {
    background: #2ecc71;
}
    </style>
</head>
<body>
    <div class="calculator">
        <h2>Income Tax Calculator</h2>
        <input type="number" id="income" placeholder="Enter Annual Income">
        <input type="number" id="deductions" placeholder="Enter Deductions (80C, HRA, etc.)">
        <button onclick="calculateTax()">Calculate Tax</button>
        <h3 class="output" id="taxOutput">Tax Payable: ₹0.00</h3>
        <a href="index.html" class="home-btn">Home</a>
    </div>
    <script>
    function calculateTax() {
        let income = parseFloat(document.getElementById("income").value) || 0;
        let deductions = parseFloat(document.getElementById("deductions").value) || 0;
        let taxableIncome = income - deductions;
        let tax = 0;
        
        if (taxableIncome <= 250000) {
            tax = 0;
        } else if (taxableIncome <= 500000) {
            tax = (taxableIncome - 250000) * 0.05;
        } else if (taxableIncome <= 1000000) {
            tax = (250000 * 0.05) + ((taxableIncome - 500000) * 0.2);
        } else {
            tax = (250000 * 0.05) + (500000 * 0.2) + ((taxableIncome - 1000000) * 0.3);
        }
        
        document.getElementById("taxOutput").innerText = "Tax Payable: ₹" + tax.toFixed(2);
    }
</script>

</body>
</html>
