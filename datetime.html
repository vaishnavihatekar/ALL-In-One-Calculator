<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date & Time Calculator</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            margin: 50px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }
        h2 {
            color: #333;
        }
        input, button {
            margin: 10px;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
        }
        input {
            width: 80%;
            border: 1px solid #ccc;
            padding: 8px;
        }
        button {
            background: #ff758c;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #ff5e78;
        }
        p {
            font-weight: bold;
            color: #555;
        }
        .home-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: linear-gradient(135deg, #2ecc71, #27ae60);
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    font-weight: bold;
    text-decoration: none;
}

.home-btn:hover {
    background: #2ecc71;
}
    </style>
</head>
<body>
    <div class="container">
        <h2>Date & Time Calculator</h2>
        <p>Current Date & Time: <span id="currentDateTime"></span></p><label>First Date & Time:</label>
    <input type="datetime-local" id="date1">
    <br>
    <label>Second Date & Time:</label>
    <input type="datetime-local" id="date2">
    <br>
    <button onclick="calculateDifference()">Calculate Difference</button>
    <p>Date Difference: <span id="dateDifference"></span> days</p>
    <p>Time Difference: <span id="timeDifference"></span> hours, <span id="minuteDifference"></span> minutes</p>
    <a href="index.html" class="home-btn">Home</a>
</div>

<script>
    function updateCurrentDateTime() {
        let now = new Date();
        document.getElementById("currentDateTime").innerText = now.toLocaleString();
    }
    setInterval(updateCurrentDateTime, 1000);
    updateCurrentDateTime();

    function calculateDifference() {
        let date1 = new Date(document.getElementById("date1").value);
        let date2 = new Date(document.getElementById("date2").value);
        if (!document.getElementById("date1").value || !document.getElementById("date2").value) {
            alert("Please enter both date and time values");
            return;
        }
        let difference = Math.abs(date2 - date1);
        let daysDifference = Math.floor(difference / (1000 * 60 * 60 * 24));
        let hoursDifference = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        let minutesDifference = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        document.getElementById("dateDifference").innerText = daysDifference;
        document.getElementById("timeDifference").innerText = hoursDifference;
        document.getElementById("minuteDifference").innerText = minutesDifference;
    }
</script>

</body>
</html>
