<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="container">
        <h1>Loan Calculator</h1>
        <input type="number" id="loanAmount" placeholder="Loan Amount (₹)">
        <input type="number" id="loanRate" placeholder="Annual Interest Rate (%)">
        <input type="number" id="loanTerm" placeholder="Loan Term (Years)">
        <button onclick="calculateLoan()">Calculate EMI</button>
        <div id="loanResult" class="result"></div>
        <a href="index.html" class="home-btn">Home</a>
    </div>
</body>
</html>
