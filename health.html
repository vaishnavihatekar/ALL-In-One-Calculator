<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health & Fitness Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        }
        .calculator-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 400px;
        }
        select, input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            transform: scale(1.05);
        }
        .home-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: linear-gradient(135deg, #2ecc71, #27ae60);
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    font-weight: bold;
    text-decoration: none;
}

.home-btn:hover {
    background: #2ecc71;
}
    </style>
</head>
<body>
    <div class="calculator-box">
        <h2>Health & Fitness Calculator</h2>
        <select id="calcType" onchange="changeFields()">
            <option value="bmi">BMI (Body Mass Index)</option>
            <option value="bmr">BMR (Basal Metabolic Rate)</option>
            <option value="calories">Daily Calorie Needs</option>
        </select>
        <div id="inputFields"></div>
        <button onclick="calculate()">Calculate</button>
        <h3 id="result">Result: </h3>
        <a href="index.html" class="home-btn">Home</a>
    </div>
    <script>
    function changeFields() {
        let type = document.getElementById("calcType").value;
        let fields = document.getElementById("inputFields");
        fields.innerHTML = "";
        
        if (type === "bmi") {
            fields.innerHTML = '<input type="number" id="weight" placeholder="Weight (kg)">' +
                              '<input type="number" id="height" placeholder="Height (cm)">';
        } else if (type === "bmr") {
            fields.innerHTML = '<input type="number" id="weight" placeholder="Weight (kg)">' +
                              '<input type="number" id="height" placeholder="Height (cm)">' +
                              '<input type="number" id="age" placeholder="Age">' +
                              '<select id="gender"><option value="male">Male</option><option value="female">Female</option></select>';
        } else if (type === "calories") {
            fields.innerHTML = '<input type="number" id="weight" placeholder="Weight (kg)">' +
                              '<input type="number" id="height" placeholder="Height (cm)">' +
                              '<input type="number" id="age" placeholder="Age">' +
                              '<select id="gender"><option value="male">Male</option><option value="female">Female</option></select>' +
                              '<select id="activity"><option value="1.2">Sedentary</option><option value="1.375">Lightly Active</option><option value="1.55">Moderately Active</option><option value="1.725">Very Active</option><option value="1.9">Super Active</option></select>';
        }
    }

    function calculate() {
        let type = document.getElementById("calcType").value;
        let result = 0;
        
        if (type === "bmi") {
            let weight = parseFloat(document.getElementById("weight").value);
            let height = parseFloat(document.getElementById("height").value) / 100;
            result = weight / (height * height);
            result = "BMI: " + result.toFixed(2);
        } else if (type === "bmr") {
            let weight = parseFloat(document.getElementById("weight").value);
            let height = parseFloat(document.getElementById("height").value);
            let age = parseInt(document.getElementById("age").value);
            let gender = document.getElementById("gender").value;
            if (gender === "male") {
                result = 88.36 + (13.4 * weight) + (4.8 * height) - (5.7 * age);
            } else {
                result = 447.6 + (9.2 * weight) + (3.1 * height) - (4.3 * age);
            }
            result = "BMR: " + result.toFixed(2) + " kcal/day";
        } else if (type === "calories") {
            let weight = parseFloat(document.getElementById("weight").value);
            let height = parseFloat(document.getElementById("height").value);
            let age = parseInt(document.getElementById("age").value);
            let gender = document.getElementById("gender").value;
            let activity = parseFloat(document.getElementById("activity").value);
            let bmr = 0;
            if (gender === "male") {
                bmr = 88.36 + (13.4 * weight) + (4.8 * height) - (5.7 * age);
            } else {
                bmr = 447.6 + (9.2 * weight) + (3.1 * height) - (4.3 * age);
            }
            result = bmr * activity;
            result = "Daily Calories Needed: " + result.toFixed(2) + " kcal";
        }
        
        document.getElementById("result").innerText = result;
    }

    changeFields();
</script>

</body>
</html>
