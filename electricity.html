<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Bill Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: white;
        }
        .container {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        input, button {
            margin: 10px;
            padding: 10px;
            border-radius: 5px;
            border: none;
            outline: none;
        }
        button {
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        .output {
            margin-top: 20px;
            font-size: 1.2em;
        }
        .home-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: linear-gradient(135deg, #2ecc71, #27ae60);
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    font-weight: bold;
    text-decoration: none;
}

.home-btn:hover {
    background: #2ecc71;
}
    </style>
</head>
<body>
    <div class="container">
        <h2>Electricity Bill Calculator</h2>
        <input type="number" id="units" placeholder="Enter units consumed" min="0">
        <input type="number" id="rate" placeholder="Enter rate per unit (₹)" min="0" step="0.01">
        <button onclick="calculateBill()">Calculate</button>
        <div class="output" id="result"></div>
        <a href="index.html" class="home-btn">Home</a>
    </div>
    <script>
        function calculateBill() {
            let units = parseFloat(document.getElementById("units").value);
            let rate = parseFloat(document.getElementById("rate").value);
            if (isNaN(units) || isNaN(rate) || units < 0 || rate < 0) {
                document.getElementById("result").innerHTML = "Please enter valid values.";
                return;
            }
            let billAmount = units * rate;
            document.getElementById("result").innerHTML = `
                <strong>Units Consumed:</strong> ${units} kWh<br>
                <strong>Rate per Unit:</strong> ₹${rate.toFixed(2)}<br>
                <strong>Total Bill Amount:</strong> ₹${billAmount.toFixed(2)}
            `;
        }
    </script>
</body>
</html>
