<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login To All-In-One-Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff512f, #dd2476);
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 400px;
        }
        h2 {
            color: white;
            background: linear-gradient(90deg, #6a11cb, #2575fc);
            padding: 10px;
            border-radius: 10px;
        }
        input {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            background: #f8f9fa;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: linear-gradient(90deg, #6a11cb, #2575fc);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 18px;
        }
        button:hover {
            background: linear-gradient(90deg, #2575fc, #6a11cb);
            transform: scale(1.05);
        }
        .back-btn {
            background: gray;
        }
        .back-btn:hover {
            background: darkgray;
        }
    </style>
    <script>
        function login() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;
            var users = JSON.parse(localStorage.getItem("users")) || [];

            var validUser = users.find(user => user.username === username && user.password === password);

            if (validUser) {
                alert("Login successful!");
                window.location.href = "index.html";
            } else {
                alert("Invalid username or password!");
            }
        }

        function goBack() {
            window.location.href = "signup.html"; // Update with your actual sign-in page filename
        }
    </script>
</head>
<body>
    <div class="login-box">
        <h2>Login To All-In-One-Calculator</h2>
        <input type="text" id="username" placeholder="Enter Username">
        <input type="password" id="password" placeholder="Enter Password">
        <button onclick="login()">Login</button>
        <button class="back-btn" onclick="goBack()">Back</button>
    </div>
</body>
</html>
