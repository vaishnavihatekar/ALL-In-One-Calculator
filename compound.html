<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Compound Interest Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="container">
        <h1>Compound Interest Calculator</h1>
        <input type="number" id="principal" placeholder="Principal Amount (₹)">
        <input type="number" id="interestRate" placeholder="Annual Interest Rate (%)">
        <input type="number" id="years" placeholder="Years">
        <input type="number" id="timesCompounded" placeholder="Times Compounded Per Year">
        <button onclick="calculateCompoundInterest()">Calculate</button>
        <div id="compoundResult" class="result"></div>
        <a href="index.html" class="home-btn">Home</a>
    </div>
</body>
</html>
