<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dollar to Rupee Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            margin: 50px;
        }
        .container {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease-in-out;
        }
        .container:hover {
            transform: scale(1.05);
        }
        input, button {
            margin: 10px;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
        }
        input {
            width: 200px;
            text-align: center;
        }
        button {
            background: #ff6b6b;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #ff4757;
        }
        #result {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
            color: #2d3436;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>💰 Dollar to Rupee Converter 💰</h2>
        <input type="number" id="dollar" placeholder="Enter amount in $" />
        <button onclick="convertCurrency()">Convert</button>
        <p id="result">₹ 0.00</p>
    </div><script>
    function convertCurrency() {
        let dollar = document.getElementById("dollar").value;
        let exchangeRate = 83.00; // डॉलरचा अंदाजे विनिमय दर
        let rupees = dollar * exchangeRate;
        document.getElementById("result").innerText = dollar ? ₹ ${rupees.toFixed(2)} : "₹ 0.00";
    }
</script>

</body>
</html>
